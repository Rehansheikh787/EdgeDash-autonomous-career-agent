# ── Verification Thresholds (Rule 39) ────────────────────────────
# min_score_spread: Catches score inflation/compression (scores clustered within narrow range)
min_score_spread: 10
# min_score_stdev: Catches uniform scoring without variance across candidates
min_score_stdev: 5.0
# max_empty_extraction_pct: Catches broken LLM extractor or silent schema degradation
max_empty_extraction_pct: 20.0
# max_skills_per_listing: Catches hallucination/prompt degradation dumping sentences as skill names
max_skills_per_listing: 50

# min_gap_sample: Catches ranking a single outlier/rumour listing as a primary career gap
min_gap_sample: 3
# max_data_age_days: Catches pipeline starvation or stale data ingestion
max_data_age_days: 3

# ── Natural Language Query Abuse Guards ────────────────────────────
# max_daily_queries: Daily global quota across all sessions to prevent API credit burn
max_daily_queries: 200


