name: EdgeDash Scheduled Career Intelligence Cycle

on:
  schedule:
    # 06:00 IST (UTC+05:30) == 00:30 UTC daily
    - cron: '30 0 * * *'
  workflow_dispatch:  # Manual trigger for ad-hoc cycles

concurrency:
  group: edgedash-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    name: Run Autonomous Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Rule 51: Hard 10-minute timeout

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Secrets Configuration
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL secret is NOT configured in GitHub Repository Secrets! The workflow cannot sync with Supabase. Please add DATABASE_URL under Repo -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Migrate Database Schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m edgedash.storage --migrate

      - name: Execute Autonomous Agent Cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python run_cycle.py

      - name: Generate Diagnostics Log
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m edgedash.diagnose > cycle_diagnostics.txt 2>&1 || true

      - name: Verify Post-Cycle System Health
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m edgedash.health

      - name: Upload Cycle Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-diagnostics-${{ github.run_id }}
          path: |
            cycle_diagnostics.txt
          retention-days: 14
